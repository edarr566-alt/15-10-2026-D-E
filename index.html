<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Una carta para ti</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=IM+Fell+English:ital@0;1&family=Sansita+Swashed:wght@500;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
:root{--wax:#8c1d2e;--wax2:#b3283d;--paper:#ecd9a6;--ink:#3a2412;--forest:#24441f;--moss:#5f8f3a;--denim:#6f93b9;--cream:#fff6dc;--panel:#f8f2e2;--line:#d9ccaa;--accent:#3f6b2c;--danger:#9b2335;--panelW:min(430px,100vw);
--disp:'Sansita Swashed','Brush Script MT',cursive;--hand:'Caveat','Segoe Script',cursive;--body:'IM Fell English',Georgia,'Times New Roman',serif;--ui:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
html,body{height:100%}
body{background:#14240f;color:var(--ink);font-family:var(--body);overflow:hidden;-webkit-tap-highlight-color:transparent;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
button{font:inherit;cursor:pointer;color:inherit}
img{max-width:100%}
.app{position:fixed;inset:0;padding:inherit}
.stage{position:absolute;inset:0;overflow:hidden;container-type:size;transition:right .35s,bottom .35s}
.editing .stage{right:var(--panelW)}
.hand{font-family:var(--hand);font-weight:700}

/* ===== escena ===== */
.scene{position:absolute;inset:0;--u:min(1cqw,.75cqh)}
.scene-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 62%}
.scene-shade{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,transparent 40%,rgba(8,22,6,.45) 100%),linear-gradient(180deg,rgba(10,30,8,.35),transparent 28%)}
.hero{position:absolute;top:3.5%;left:0;right:0;text-align:center;padding:0 5%;z-index:70;pointer-events:none}
.editing .hero [contenteditable]{pointer-events:auto}
.hero .kick{font-size:clamp(20px,3.4cqw,34px);color:#fff7d6;text-shadow:0 2px 6px rgba(0,0,0,.6)}
.hero .t3d{font-size:clamp(36px,8cqw,92px);margin:.05em 0}
.hero .sub{font-size:clamp(18px,2.8cqw,30px);color:#fff7d6;text-shadow:0 2px 6px rgba(0,0,0,.6)}
.t3d{font-family:var(--disp);font-weight:800;line-height:1.05;color:var(--face,#fff3c4);letter-spacing:.01em;
 text-shadow:0 1px 0 var(--e1,#c98a2b),0 2px 0 var(--e1,#c98a2b),0 3px 0 var(--e2,#a56a1c),0 4px 0 var(--e2,#a56a1c),0 5px 0 var(--e3,#7b4a12),0 6px 0 var(--e3,#7b4a12),0 7px 0 var(--e4,#4f2e0a),0 8px 0 var(--e4,#4f2e0a),0 9px 0 var(--e4,#4f2e0a),0 15px 18px rgba(0,0,0,.45);
 transform:perspective(700px) rotateX(12deg);transform-origin:50% 100%;overflow-wrap:anywhere}
.t-par{--face:#f8e6ae;--e1:#a83245;--e2:#862236;--e3:#601627;--e4:#3d0b17}
.decolayer{position:absolute;inset:0;pointer-events:none}
.pagelayer{z-index:30}
.deco{position:absolute;pointer-events:none;user-select:none;-webkit-user-select:none}
.deco .in{width:100%;transform-origin:50% 90%}
.deco svg,.deco img{display:block;width:100%;height:auto;filter:drop-shadow(0 4px 5px rgba(0,0,0,.35));pointer-events:none}
.deco.flower .in{animation:sway 5.5s ease-in-out infinite alternate}
.deco.pet .in{animation:bob 3.4s ease-in-out infinite}
@keyframes sway{from{transform:rotate(-2.4deg)}to{transform:rotate(2.4deg)}}
@keyframes bob{50%{transform:translateY(-2.5%)}}
.editing .deco{pointer-events:auto;cursor:grab;touch-action:none}
.deco.sel{outline:2px dashed #fff;outline-offset:4px;box-shadow:0 0 0 4px rgba(63,107,44,.5)}
.hd{position:absolute;width:22px;height:22px;border-radius:50%;background:#fff;border:3px solid var(--accent);touch-action:none}
.hd-size{right:-12px;bottom:-12px;cursor:nwse-resize}
.hd-rot{left:50%;top:-34px;margin-left:-11px;cursor:grab}
.hd-rot::after{content:"";position:absolute;left:50%;top:100%;width:2px;height:12px;background:#fff;margin-left:-1px}

/* ===== sobre ===== */
.env-wrap{position:absolute;left:0;right:0;margin:0 auto;bottom:8%;width:min(84cqw,500px);aspect-ratio:3/2;z-index:60;cursor:pointer;animation:float 4.8s ease-in-out infinite;transition:opacity .7s,transform .9s}
@keyframes float{50%{transform:translateY(-8px)}}
.envelope{position:relative;width:100%;height:100%;perspective:1100px}
.env-back{position:absolute;inset:0;background:linear-gradient(#d9c48f,#c4a86b);border-radius:5px;box-shadow:0 24px 38px rgba(0,0,0,.5)}
.env-letter{position:absolute;left:6%;right:6%;top:5%;bottom:5%;z-index:2;border-radius:3px;background:linear-gradient(#f4e6bb,#e7d09a);box-shadow:0 2px 6px rgba(0,0,0,.3);display:grid;place-items:center;text-align:center;transition:transform .9s .6s cubic-bezier(.3,.9,.3,1)}
.env-letter span{font-family:var(--hand);font-size:clamp(18px,4.4cqw,30px);color:#6b3a1a}
.open .env-letter{transform:translateY(-70%)}
.env-front{position:absolute;inset:0;z-index:3;pointer-events:none}
.env-front i{position:absolute;inset:0;display:block}
.env-front .l{clip-path:polygon(0 0,52% 55%,0 100%);background:linear-gradient(100deg,#f1e5c1,#e1cf9f)}
.env-front .r{clip-path:polygon(100% 0,48% 55%,100% 100%);background:linear-gradient(260deg,#f1e5c1,#dcc895)}
.env-front .b{clip-path:polygon(0 100%,50% 45%,100% 100%);background:linear-gradient(0deg,#f6ecce,#e8d7a9)}
.env-flap{position:absolute;left:0;right:0;top:0;height:57%;z-index:5;transform-origin:50% 0;transform-style:preserve-3d}
.env-flap .fa,.env-flap .fb{position:absolute;inset:0;clip-path:polygon(0 0,100% 0,50% 100%);backface-visibility:hidden;-webkit-backface-visibility:hidden}
.env-flap .fa{background:linear-gradient(180deg,#f5ebcb,#e4d1a0)}
.env-flap .fb{transform:rotateX(180deg);background:radial-gradient(circle at 20% 30%,#fff8 0 2px,transparent 3px) 0 0/22px 22px,radial-gradient(circle at 70% 70%,#fff6 0 2px,transparent 3px) 0 0/22px 22px,linear-gradient(#7fa2c6,#5d82aa)}
.open .env-flap{animation:flap 1s .1s forwards}
@keyframes flap{0%{transform:rotateX(0);z-index:5}45%{transform:rotateX(-90deg);z-index:5}46%{z-index:1}100%{transform:rotateX(-180deg);z-index:1}}
.seal{position:absolute;left:50%;top:57%;width:22%;aspect-ratio:1;margin:-11% 0 0 -11%;z-index:7;filter:drop-shadow(0 5px 5px rgba(0,0,0,.5));transition:transform .2s}
.env-wrap:hover .seal{transform:scale(1.06) rotate(-3deg)}
.seal svg{width:100%;height:100%;display:block}
.open .seal{animation:crack .5s forwards}
@keyframes crack{40%{transform:scale(1.25) rotate(8deg)}100%{transform:scale(.4) rotate(-20deg);opacity:0}}
.env-wrap.delivering{animation:none;pointer-events:none}
.env-wrap.arriving,.deco.courier{visibility:hidden}
.env-wrap.delivering .env-hint{opacity:0}
.env-hint{transition:opacity .8s}
.intro-msg{position:absolute;left:0;right:0;top:37%;text-align:center;font-family:var(--hand);font-size:clamp(22px,4cqw,38px);color:#fff7d6;text-shadow:0 2px 8px rgba(0,0,0,.8);opacity:0;transition:opacity .6s;pointer-events:none;z-index:70;padding:0 6%}
.scene.intro .intro-msg{opacity:1}
.env-hint{position:absolute;left:0;right:0;top:106%;text-align:center;font-family:var(--hand);font-size:clamp(20px,3.4cqw,28px);color:#fff7d6;text-shadow:0 2px 6px rgba(0,0,0,.7)}
.open .env-hint{opacity:0}
.reading .env-wrap,.reading .hero{opacity:0;pointer-events:none;transform:translateY(30px) scale(.94)}

/* ===== lector ===== */
.reader{position:absolute;inset:0;display:none;opacity:0;z-index:100;transition:opacity .7s;background:radial-gradient(ellipse at center,rgba(10,25,8,.3),rgba(6,16,5,.8))}
.reading .reader{display:block}
.reader.in{opacity:1}
.sheetwrap{position:absolute;left:0;right:0;top:2.5%;bottom:84px;display:grid;place-items:center;padding:0 2%}
.sheet{position:relative;width:min(96cqw,780px);height:100%;max-height:980px;container-type:inline-size;--u:1cqw;filter:drop-shadow(0 20px 28px rgba(0,0,0,.6));transform:scale(.7) translateY(18%);transition:transform .9s cubic-bezier(.2,.9,.25,1)}
.reader.in .sheet{transform:none}
.parch{position:absolute;inset:22px;filter:url(#burn);
 background:
 radial-gradient(circle at 0 0,#140802 0,#331505 6%,rgba(130,60,10,.6) 13%,transparent 27%),
 radial-gradient(circle at 100% 0,#140802 0,#331505 5%,rgba(130,60,10,.55) 12%,transparent 24%),
 radial-gradient(circle at 0 100%,#140802 0,#331505 7%,rgba(130,60,10,.6) 15%,transparent 29%),
 radial-gradient(circle at 100% 100%,#140802 0,#331505 6%,rgba(130,60,10,.6) 14%,transparent 27%),
 radial-gradient(circle at 72% 62%,rgba(140,90,30,.22),transparent 24%),
 radial-gradient(circle at 18% 70%,rgba(140,90,30,.18),transparent 20%),
 url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.75' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .35 0 0 0 0 .2 0 0 0 0 .05 0 0 0 .26 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"),
 radial-gradient(ellipse at 32% 22%,#f4e5ba,#e9d19b 55%,#d6b475 100%);
 box-shadow:inset 0 0 0 2px #2a1204,inset 0 0 26px 9px rgba(60,24,4,.9),inset 0 0 80px 18px rgba(130,70,14,.5)}
.page{position:absolute;inset:0;overflow:auto;scrollbar-width:thin;padding:clamp(40px,11cqw,84px) clamp(36px,12cqw,100px);font-size:clamp(15px,2.5cqw,21px);line-height:1.6;color:var(--ink)}
.page.turn-next{animation:turnN .55s both}.page.turn-prev{animation:turnP .55s both}
@keyframes turnN{from{opacity:0;transform:perspective(1200px) rotateY(24deg) translateX(30px)}}
@keyframes turnP{from{opacity:0;transform:perspective(1200px) rotateY(-24deg) translateX(-30px)}}
.page h2.t3d{font-size:clamp(28px,7.2cqw,56px);text-align:center;margin-bottom:.5em}
.page h2.t3d.sm{font-size:clamp(24px,6cqw,46px)}
.p-intro{display:grid;place-items:center;text-align:center;min-height:100%;gap:.6em;align-content:center}
.p-intro .t3d{font-size:clamp(34px,9.5cqw,76px)}
.p-intro .kick,.p-intro .to{font-family:var(--hand);font-size:1.5em;color:#6b3a1a}
.slide-hint{font-family:var(--hand);font-size:1.3em;color:#8a5a2a;margin-top:1.4em;animation:nudge 1.8s ease-in-out infinite}
@keyframes nudge{50%{transform:translateX(8px)}}
.letter{white-space:pre-wrap;font-style:italic;font-size:1.12em;line-height:1.75;min-height:6em}
.sign{text-align:right;font-family:var(--hand);font-size:1.7em;color:#6b1a2a;margin-top:1em}
[data-ph]:empty::before{content:attr(data-ph);opacity:.45}
.editing [data-path][contenteditable]{outline:1px dashed rgba(63,107,44,.7);outline-offset:3px;border-radius:3px;pointer-events:auto;cursor:text}
.editing [data-path][contenteditable]:focus{outline:2px solid var(--accent);background:rgba(255,255,255,.28)}
.grid-loves{display:grid;grid-template-columns:repeat(2,1fr);gap:3.5cqw}
.flip{perspective:900px;min-height:22cqw;cursor:pointer}
.flip-in{position:relative;width:100%;height:100%;min-height:22cqw;transform-style:preserve-3d;transition:transform .7s}
.flip.on .flip-in{transform:rotateY(180deg)}
.ff,.fb{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:10px;padding:3cqw;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;border:2px solid rgba(110,50,12,.55);box-shadow:inset 0 0 18px rgba(110,50,12,.25)}
.ff{background:linear-gradient(145deg,#f3e2b0,#e5c985)}.ff h3{font-family:var(--hand);font-size:1.7em;color:#7a1f30}
.ff .ic{color:#a83245;font-size:1.5em}
.fb{transform:rotateY(180deg);background:linear-gradient(145deg,#a83245,#7a1a2a);color:#fbe9c0;font-size:.92em;line-height:1.4;overflow:hidden}
.flip.flat{perspective:none;min-height:0}.flip.flat .flip-in{transform:none!important;transform-style:flat;min-height:0}
.flip.flat .ff,.flip.flat .fb{position:relative;transform:none;margin-bottom:6px;padding:2cqw}
.rail{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:1em}
.rail b{width:13px;height:13px;border-radius:50%;border:2px solid #6b3a1a;background:#e8cf93;cursor:pointer;transition:.3s}
.rail b.cur{background:var(--wax);transform:scale(1.4)}.rail b.done{background:#a67c3a}
.rail b.lock{opacity:.35;cursor:not-allowed;border-style:dashed}
.mdate{text-align:center;font-family:var(--hand);font-size:1.6em;color:#7a1f30;margin-bottom:.1em}
.hand-body{font-family:var(--hand);font-size:1.5em;line-height:1.35;white-space:pre-wrap;text-align:center;margin-top:1em}
.pol{background:#fffdf6;padding:2.4cqw 2.4cqw 7cqw;box-shadow:0 5px 12px rgba(40,20,5,.4);transform:rotate(var(--r,0deg));position:relative;cursor:zoom-in;transition:transform .25s}
.pol:hover{transform:rotate(0) scale(1.05);z-index:5}
.pol::before{content:"";position:absolute;top:-1.6cqw;left:50%;width:14cqw;height:3.6cqw;margin-left:-7cqw;background:rgba(240,220,150,.78);transform:rotate(calc(var(--r,0deg)*-2));box-shadow:0 1px 2px rgba(0,0,0,.2)}
.pol .ph{display:block;width:100%;aspect-ratio:1;object-fit:cover;background:#e7dfc8}
.pol.heart .ph{clip-path:url(#heartClip);background:#eadbb0}
.pol .cap{position:absolute;left:3cqw;right:3cqw;bottom:1.4cqw;text-align:center;font-family:var(--hand);font-size:clamp(13px,2.5cqw,20px);line-height:1.1;color:#4a3320;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pol.big{max-width:62%;margin:1em auto 0}
.pol .play{position:absolute;inset:2.4cqw 2.4cqw 7cqw;display:grid;place-items:center;font-size:3em;color:#fff;text-shadow:0 2px 8px #000;background:rgba(0,0,0,.25);pointer-events:none}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:4.5cqw 3.5cqw;margin-top:1.8em}
@container (max-width:520px){.pgrid{grid-template-columns:repeat(2,1fr)}.grid-loves{grid-template-columns:1fr}}
.range{text-align:center;font-family:var(--hand);font-size:1.5em;color:#7a1f30}
.empty{text-align:center;font-family:var(--hand);font-size:1.5em;color:#7a5a3a;padding:2em 0}
.fac{position:relative;margin:1.2em auto 0;width:100%;max-width:520px;aspect-ratio:16/9;background:#1d1a14 center/cover;border-radius:10px;overflow:hidden;display:grid;place-items:center;border:3px solid #6b3a1a;cursor:pointer;color:#fff}
.fac.ig{aspect-ratio:auto;padding:1.2em;background:linear-gradient(45deg,#f9a03f,#e1306c 50%,#7b3fbf);text-align:center;font-family:var(--ui);font-size:.8em}
.fac.sp{background:#121212;aspect-ratio:auto;padding:1.2em;font-family:var(--ui);font-size:.8em}
.fac .pb{width:56px;height:56px;border-radius:50%;background:rgba(140,29,46,.92);display:grid;place-items:center;font-size:24px;box-shadow:0 3px 10px rgba(0,0,0,.5)}
.fac iframe,.embed iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.fac.ig.live{display:block;padding:0;height:560px}.fac.sp.live{display:block;padding:0;height:152px}
.embed{position:relative;margin:1em auto 0;width:100%;aspect-ratio:4/3;border:3px solid #6b3a1a;border-radius:10px;overflow:hidden;background:#dfd2ac}
.embed-link{display:block;text-align:center;font-family:var(--ui);font-size:.7em;margin-top:.5em;color:#6b1a2a}
video.vid{display:block;width:100%;max-width:520px;margin:1em auto 0;border:3px solid #6b3a1a;border-radius:10px;background:#000}
.map{position:relative;width:100%;aspect-ratio:400/260;margin:.6em 0 1em;border-radius:6px;overflow:hidden;box-shadow:0 0 0 2px #6b3a1a,0 4px 12px rgba(0,0,0,.3)}
.map svg{display:block;width:100%;height:100%}
.pin{cursor:pointer}.pin text{font-family:var(--ui);font-size:11px;font-weight:700;fill:#fff;text-anchor:middle;pointer-events:none}
.pin.cur circle.pc{stroke:#fff;stroke-width:3}
.pdet h3{font-family:var(--hand);font-size:1.9em;color:#7a1f30;line-height:1.1}
.strip{display:flex;gap:10px;overflow-x:auto;padding:8px 2px 14px}
.strip .pol{flex:0 0 22cqw;padding:1.5cqw 1.5cqw 4cqw}.strip .pol::before{display:none}
.songs{display:grid;gap:1em}
.song{display:grid;grid-template-columns:auto 1fr auto;gap:.9em;align-items:center;padding:.7em .9em;border:2px solid rgba(110,50,12,.45);border-radius:12px;background:rgba(255,246,214,.5)}
.disc{width:46px;height:46px;border-radius:50%;background:radial-gradient(circle,#e9d29a 0 14%,#1c1c1c 15% 100%);box-shadow:inset 0 0 0 5px #333}
.song.on .disc{animation:spin 3s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.song h3{font-family:var(--hand);font-size:1.5em;line-height:1}.song small{font-size:.8em;color:#7a5a3a}
.pbtn{width:44px;height:44px;border-radius:50%;border:0;background:var(--wax);color:#fff;font-size:18px}
.song .sx{grid-column:1/-1}
.bigdate{text-align:center;font-family:var(--disp);font-weight:800;font-size:clamp(30px,9cqw,72px)}
.counter{display:flex;gap:2.4cqw;justify-content:center;flex-wrap:wrap;margin:1em 0}
.counter div{min-width:17cqw;padding:.6em .4em;text-align:center;border:2px solid rgba(110,50,12,.5);border-radius:10px;background:rgba(255,246,214,.5)}
.counter b{display:block;font-family:var(--disp);font-size:1.9em;color:#7a1f30;line-height:1}
.collage{position:relative;display:flex;flex-wrap:wrap;justify-content:center;gap:0;padding:1em .2em;align-content:center}
.collage .pol{margin:-.9cqw;width:var(--cw,24cqw);padding:1.2cqw 1.2cqw 3.6cqw}
.collage .pol::before{width:7cqw;height:2cqw;margin-left:-3.5cqw;top:-.9cqw}
.collage .pol .cap{display:none}
.collage .pol.heart{padding:0}.collage .pol.heart .ph{aspect-ratio:1}
.collage .pol.round .ph{border-radius:50%}
.collage .pol.round,.collage .pol.heart{background:transparent;box-shadow:none;filter:drop-shadow(0 3px 4px rgba(40,20,5,.45))}
.collage .pol.round{padding:1cqw}.collage .pol.round::before,.collage .pol.heart::before{display:none}
.cbg{position:absolute;inset:0;pointer-events:none;opacity:.35;background:radial-gradient(circle at 20% 15%,#e58a8a55 0 9%,transparent 10%),radial-gradient(circle at 85% 80%,#7fa2c655 0 12%,transparent 13%),radial-gradient(circle at 70% 10%,#f1e27a66 0 7%,transparent 8%)}
.btnrow{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:1.4em}
.pbtn2{border:2px solid #6b3a1a;background:#f3e2b0;color:#5a1a28;border-radius:999px;padding:.35em 1em;font-family:var(--hand);font-size:1.3em}
/* dock */
.dock{position:absolute;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(94cqw,780px);display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:999px;background:rgba(28,18,8,.82);backdrop-filter:blur(6px);color:#f6e3b0;z-index:110;font-family:var(--ui);font-size:13px}
.dock button{border:0;background:transparent;border-radius:50%;width:38px;height:38px;flex:none;font-size:20px;color:#f6e3b0}
.dock button:hover{background:rgba(255,255,255,.12)}
.chips{display:flex;gap:6px;overflow-x:auto;flex:1;scrollbar-width:none}
.chip{white-space:nowrap;border:1px solid rgba(246,227,176,.35);background:transparent;border-radius:999px;padding:5px 11px;font-size:12.5px;width:auto!important;height:auto!important;font-size:12.5px!important}
.chip.on{background:#f6e3b0!important;color:#3a1a0a!important}
.cnt{opacity:.75;font-size:12px;white-space:nowrap}
.eq{display:inline-flex;gap:2px;align-items:flex-end;height:14px}.eq i{width:3px;background:#f6e3b0;animation:eq .9s ease-in-out infinite alternate;height:4px}
.eq i:nth-child(2){animation-delay:.2s}.eq i:nth-child(3){animation-delay:.4s}
@keyframes eq{to{height:14px}}
.mus-off .eq i{animation:none}
.back-env{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));left:10px;z-index:120;border:0;border-radius:999px;background:rgba(28,18,8,.7);color:#f6e3b0;padding:7px 14px;font-family:var(--ui);font-size:13px}
.spdock{position:absolute;left:50%;transform:translateX(-50%);bottom:84px;width:min(92cqw,420px);z-index:115}
.spdock iframe{width:100%;height:80px;border:0;border-radius:12px}
.ytbox{position:fixed;left:-300px;top:0;width:200px;height:200px;opacity:0;pointer-events:none}
/* fab / toast / lightbox / quiz */
.fab[hidden]{display:none}
.fab{position:absolute;right:14px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:400;width:54px;height:54px;border-radius:50%;border:0;background:var(--wax);color:#fff;box-shadow:0 6px 18px rgba(0,0,0,.5);font-size:22px;display:grid;place-items:center;transition:right .35s}
.editing .fab{right:calc(var(--panelW) + 14px)}
.reading:not(.editing) .fab{bottom:calc(86px + env(safe-area-inset-bottom,0px));width:44px;height:44px;opacity:.55}
.toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:#20170c;color:#fbe9c0;padding:10px 18px;border-radius:999px;font-family:var(--ui);font-size:14px;z-index:900;box-shadow:0 8px 24px rgba(0,0,0,.45);max-width:92vw;text-align:center}
.lb{position:fixed;inset:0;background:rgba(8,6,2,.92);z-index:800;display:grid;place-items:center;padding:3vh 3vw}
.lb .box{max-width:min(94vw,1000px);max-height:90vh;display:grid;place-items:center;position:relative;width:100%}
.lb img,.lb video{max-width:100%;max-height:82vh;border-radius:6px;box-shadow:0 10px 40px #000}
.lb iframe{width:min(92vw,440px);height:80vh;border:0;background:#fff;border-radius:8px}
.lb .lcap{color:#fbe9c0;font-family:var(--hand);font-size:26px;margin-top:10px;text-align:center}
.lb button{position:absolute;border:0;background:rgba(255,255,255,.14);color:#fff;width:46px;height:46px;border-radius:50%;font-size:24px}
.lb .x{top:10px;right:10px}.lb .pv{left:8px;top:50%}.lb .nx{right:8px;top:50%}
.quiz{position:absolute;inset:0;z-index:250;display:grid;place-items:center;background:rgba(8,18,6,.7);padding:20px}
.quiz .card{background:linear-gradient(#f4e6bb,#e7d09a);border:3px solid #6b3a1a;border-radius:14px;padding:22px;max-width:420px;width:100%;text-align:center}
.quiz h3{font-family:var(--hand);font-size:2em;color:#7a1f30;line-height:1.1;margin-bottom:.6em}
.quiz button{display:block;width:100%;margin:8px 0;padding:10px;border:2px solid #6b3a1a;border-radius:10px;background:#fff6dc;font-family:var(--body);font-size:18px}
.quiz .shake{animation:shake .4s}@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
/* ===== panel ===== */
.panel{position:absolute;top:0;right:0;bottom:0;width:var(--panelW);background:var(--panel);color:#2b2414;font-family:var(--ui);font-size:14px;transform:translateX(102%);transition:transform .35s cubic-bezier(.3,.8,.3,1);z-index:300;display:flex;flex-direction:column;box-shadow:-12px 0 40px rgba(0,0,0,.35)}
.editing .panel{transform:none}
.ph-head{padding:12px 14px 0;display:flex;justify-content:space-between;align-items:center}
.ph-head b{font-family:var(--disp);font-size:20px;color:var(--wax)}
.ph-head small{color:#7a6f52}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 12px;border-bottom:1px solid var(--line);scrollbar-width:none}
.tab{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;color:#4a4331;font-size:13px}
.tab.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.pbody{flex:1;overflow:auto;padding:14px 14px 60px}
.f{display:block;margin:0 0 12px}.f>span{display:block;font-weight:600;margin-bottom:4px;color:#4a4331;font-size:13px}
.f input[type=text],.f input[type=date],.f input[type=url],.f textarea,.f select{width:100%;padding:8px 10px;border:1px solid #cdbf98;border-radius:8px;background:#fff;font:inherit;color:inherit}
.f textarea{resize:vertical;line-height:1.4}
.f input[type=range]{width:100%;accent-color:var(--accent)}
.chk{display:flex;gap:8px;align-items:center;margin:0 0 12px}
.bt{border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:8px;padding:8px 12px;font-size:13px}
.bt.o{background:#fff;color:var(--accent)}.bt.d{background:#fff;border-color:var(--danger);color:var(--danger)}.bt.s{padding:5px 9px;font-size:12px}
.bt:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 12px}
.card{border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px;margin:0 0 12px}
.card h4{font-size:13px;margin:0 0 8px;color:var(--wax);display:flex;justify-content:space-between;align-items:center;gap:8px}
.sechead{background:#efe6c8;border-radius:12px;padding:12px;margin-bottom:14px}
.meter{height:10px;background:#e8dfc4;border-radius:99px;overflow:hidden;margin:4px 0 2px}.meter i{display:block;height:100%;background:linear-gradient(90deg,#5f8f3a,#c98a2b)}
.mini{width:58px;height:58px;object-fit:cover;border-radius:6px;border:1px solid var(--line);background:#eee}
.thumbs{display:flex;gap:6px;flex-wrap:wrap}
.lib{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.lib button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:6px 2px;font-size:11px}.lib svg,.lib img{width:100%;height:46px;display:block;object-fit:contain}
.dl{display:flex;align-items:center;gap:8px;padding:6px 8px;border:1px solid var(--line);border-radius:10px;background:#fff;margin-bottom:6px;font-size:13px}
.dl.sel{border-color:var(--accent);background:#eef5e6}.dl span{flex:1;cursor:pointer}
.note{font-size:12.5px;color:#6a5f43;line-height:1.45;margin:0 0 12px}
.steps{padding-left:18px;font-size:13px;line-height:1.55;color:#3d3624}.steps li{margin-bottom:6px}
@media (max-width:760px){
 .panel{top:auto;left:0;width:100%;height:54vh;transform:translateY(102%);border-radius:18px 18px 0 0}
 .editing .stage{right:0;bottom:54vh}
 .editing .fab{right:14px;bottom:calc(54vh + 14px)}
 .hd{width:28px;height:28px}
}

.sarrow{position:absolute;left:50%;bottom:46px;transform:translateX(-50%);z-index:40;width:46px;height:46px;border-radius:50%;border:0;background:rgba(122,31,48,.92);color:#fff;font-size:26px;line-height:1;display:grid;place-items:center;opacity:0;pointer-events:none;transition:opacity .35s;box-shadow:0 4px 12px rgba(0,0,0,.45);animation:bnc 1.5s ease-in-out infinite}

@keyframes bnc{50%{margin-bottom:-7px}}
.feed{position:relative;margin-top:.8em}
.hentry{position:relative;text-align:center;padding-bottom:2.6em;opacity:0;transform:translateY(40px) scale(.96);transition:opacity .9s,transform .9s cubic-bezier(.2,.8,.3,1)}
.hentry.in{opacity:1;transform:none}
.hentry:not(:last-child)::after{content:"";position:absolute;left:50%;bottom:.3em;height:1.8em;border-left:2px dashed rgba(122,31,48,.5)}
.mhead{text-align:center;font-family:var(--disp);font-weight:800;font-size:1.5em;color:#7a1f30;margin:1.2em 0 .1em;text-transform:capitalize}
.hcap{font-family:var(--hand);font-size:1.6em;line-height:1.1;color:#4a2a14;margin-top:.7em}
.htext{font-style:italic;margin-top:.2em;white-space:pre-wrap}
.hcap:empty:not([contenteditable]),.htext:empty:not([contenteditable]){display:none}
.vgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:4cqw 3.5cqw;margin-top:1.2em}
.vtile{position:relative;aspect-ratio:16/9;background:#1d1a14;border:3px solid #6b3a1a;border-radius:10px;overflow:hidden;box-shadow:0 5px 12px rgba(40,20,5,.4)}
.vtile video,.vtile iframe{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border:0;pointer-events:none;background:#000}
.vtile.ig{aspect-ratio:auto;overflow:visible;background:none;border:0;box-shadow:none}.vtile.ig .fac{margin:0;max-width:none}
.vmiss{position:absolute;inset:0;display:grid;place-items:center;color:#d9c9a0;font-family:var(--ui);font-size:.8em}
.vcap{font-family:var(--hand);font-size:1.4em;text-align:center;line-height:1.1;margin-top:.3em}.vcap:empty:not([contenteditable]){display:none}
.proj{position:fixed;inset:0;z-index:850;background:#0b0905;display:grid;gap:1.2vmin;padding:1.2vmin;grid-auto-rows:1fr;animation:fin .7s}
.proj .vtile{aspect-ratio:auto;height:100%;min-height:0;border:0;border-radius:12px}
.ptitle{position:absolute;left:0;right:0;bottom:4vmin;text-align:center;font-family:var(--disp);font-weight:800;font-size:clamp(28px,6vmin,64px);color:#fff3c4;text-shadow:0 3px 14px #000;pointer-events:none;animation:fout 1.2s 5s forwards}
.pclose{position:absolute;top:10px;right:10px;width:46px;height:46px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;font-size:26px;z-index:3}
@keyframes fin{from{opacity:0}}@keyframes fout{to{opacity:0}}
.postal{position:relative;width:var(--cw,24cqw);aspect-ratio:3/2;margin:-1.1cqw;padding:.9cqw;background:#fbf4de;box-shadow:0 4px 10px rgba(40,20,5,.42);transform:rotate(var(--r,0deg));cursor:zoom-in;animation:land .95s var(--i,0s) backwards cubic-bezier(.2,.9,.3,1.15);border:max(3px,.55cqw) solid transparent;border-image:repeating-linear-gradient(135deg,#c8203f 0 9px,#fff 9px 18px,#3b6fb5 18px 27px) 10;transition:transform .25s}
.postal:hover{transform:rotate(0) scale(1.08);z-index:6}
.postal .ph{width:100%;height:100%;object-fit:cover;display:block;background:#eadbb0}
.postal.empty .ph{display:grid;place-items:center;font-family:var(--hand);font-size:2em;color:#a67c3a}
.pstamp{position:absolute;top:1.5cqw;right:1.5cqw;width:4.4cqw;height:5.4cqw;background:#f4dca0;outline:2px dotted #fffaf0;outline-offset:1px;display:grid;place-items:center;color:#b3283d;font-size:2.4cqw;transform:rotate(4deg)}
.pmark{position:absolute;top:1.2cqw;right:6.2cqw;font:700 1.3cqw var(--ui);color:rgba(60,30,10,.8);border:2px solid rgba(60,30,10,.55);border-radius:50%;padding:.5cqw .7cqw;transform:rotate(-12deg);background:rgba(255,250,235,.6)}
@keyframes land{from{opacity:0;transform:translateY(-70px) rotate(calc(var(--r,0deg)*5)) scale(1.4)}}
.collage.postals{padding:1.6em .6em;min-height:30cqw}
.meet{text-align:center;margin:1.2em 0 .2em}.meet b{display:block;font-size:clamp(46px,14cqw,110px);line-height:1}
.meet span{display:block;font-family:var(--hand);font-size:1.7em;color:#7a1f30;margin-top:.1em}
.dgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:3cqw;margin-top:1em}
.dcard{border:2px solid rgba(110,50,12,.5);border-radius:12px;background:rgba(255,246,214,.55);padding:.8em .6em;text-align:center}
.dlabel{font-family:var(--hand);font-size:1.5em;color:#7a1f30;line-height:1.1}
.dnum{font-family:var(--disp);font-weight:800;font-size:1.25em;color:#3a2412;margin:.3em 0 .1em}
.dsub{font-size:.88em;color:#6b4a2a;line-height:1.35}
@container (max-width:520px){.vgrid,.dgrid{grid-template-columns:1fr}}
.map.adding{cursor:crosshair;box-shadow:0 0 0 3px var(--wax),0 4px 12px rgba(0,0,0,.3)}
.editing .map{touch-action:none}
.pedit input{width:100%;padding:8px 10px;border:1px solid #8a5a2a;border-radius:8px;font:14px var(--ui);background:#fffaf0;color:#2b2414}
.pbtn2.on{background:var(--wax);color:#fff}

.scene-music{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));left:10px;z-index:90;border:0;border-radius:999px;background:rgba(28,18,8,.72);color:#f6e3b0;padding:8px 14px;font:13px var(--ui);display:flex;align-items:center;gap:8px;backdrop-filter:blur(4px)}
.reading .scene-music{display:none}
.game-wrap{position:absolute;top:0;bottom:0;right:3%;display:flex;align-items:center;z-index:80;pointer-events:none}
.game{pointer-events:auto;width:min(370px,36cqw);min-width:300px;max-height:94cqh;overflow:auto;background:linear-gradient(#f4e6bb,#e7d09a);border:3px solid #6b3a1a;border-radius:16px;padding:12px 12px 10px;box-shadow:0 14px 34px rgba(0,0,0,.5),inset 0 0 22px rgba(110,50,12,.25);color:var(--ink);animation:gin .8s both}
.game.out{animation:gout .8s forwards}
.game.won{box-shadow:0 0 0 4px rgba(255,210,77,.9),0 14px 34px rgba(0,0,0,.5)}
.g-title{font-size:clamp(26px,3.4cqw,36px);text-align:center;margin-bottom:.1em}
.g-sub{text-align:center;font-size:18px;color:#6b3a1a;margin:0 0 .5em;line-height:1.05}
.g-row{display:grid;grid-template-columns:58px 1fr;gap:10px;align-items:center;padding:8px;border:2px solid rgba(110,50,12,.45);border-radius:12px;background:rgba(255,246,214,.55);margin-bottom:8px}
.g-pic img{width:100%;display:block;filter:brightness(0) opacity(.5);transition:filter .9s}
.g-row.done .g-pic img{filter:brightness(1) opacity(1);animation:pop .6s}
.g-hint{font-family:var(--hand);font-size:18px;line-height:1.05;color:#7a1f30}
.g-cnt{font:11px var(--ui);color:#7a6a4a;margin:2px 0 5px}
.g-slots{display:flex;gap:5px;margin-bottom:7px}
.g-slot{width:30px;height:30px;border:2px dashed #8a5a2a;border-radius:8px;display:grid;place-items:center;font:800 17px var(--disp);color:#7a1f30;background:rgba(255,255,255,.35)}
.g-slot.on{border-style:solid;background:#fff6dc;animation:pop .35s}
.g-slot.next{border-color:var(--wax);animation:blink 1s ease-in-out infinite}
.g-tiles{display:flex;gap:5px;flex-wrap:wrap}
.g-tile{width:32px;height:32px;border-radius:8px;border:2px solid #4a0b17;background:linear-gradient(#b3283d,#7a1a2a);color:#fbe9c0;font:800 17px var(--disp);box-shadow:0 3px 0 #4a0b17;padding:0}
.g-tile:active{transform:translateY(2px);box-shadow:0 1px 0 #4a0b17}
.g-tile.used{visibility:hidden}.g-tile.wrong{animation:shake .4s}
.g-tile.glow{animation:glow .9s ease-in-out infinite;border-color:#ffd24d}
.g-msg{text-align:center;font-family:var(--hand);font-size:18px;color:#5a1a28;min-height:1.3em;margin:2px 0 6px;line-height:1.05}
.g-actions{display:flex;gap:8px;justify-content:center}
@keyframes pop{50%{transform:scale(1.22)}}
@keyframes blink{50%{box-shadow:0 0 0 4px rgba(179,40,61,.35);background:#fff}}
@keyframes glow{50%{box-shadow:0 0 0 5px rgba(255,210,77,.95),0 3px 0 #4a0b17;transform:scale(1.12)}}
@keyframes gin{from{opacity:0;transform:translateX(40px)}}
@keyframes gout{to{opacity:0;transform:translateX(40px) scale(.92)}}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

  fPhoto('Imagen del mapa (opcional): sube una captura de tu mapa y coloca los pines encima',S.lugares.mapImg,id=>{S.lugares.mapImg=id;renderPage();renderPanel();}));
 S.lugares.items.forEach(p=>r.append(h('div',{class:'card'},itemHead(p.name,S.lugares.items,p,'manual',btn('Ver',()=>{ui.place=p.id;if(ui.view!=='reader')openReader(true);goSec('lugares');renderPage();},'o s')),fText('Nombre',`lugares.items.${p.id}.name`),fText('Dirección o enlace de Maps',`lugares.items.${p.id}.q`,{after:redraw}),fText('Nota',`lugares.items.${p.id}.note`,{area:1,rows:3}),
  h('div',{class:'f'},h('span',null,`Fotos del lugar (${p.photos.length}/${LIM.placePhotos})`),h('div',{class:'thumbs'},...p.photos.map(m=>h('div',null,h('img',{class:'mini',src:mediaSrc(m),alt:''}),h('div',null,btn('✕',()=>{p.photos=p.photos.filter(x=>x!==m);scheduleSave();gc();renderPanel();renderPage();},'d s'))))),
   btn('Agregar fotos',async()=>{const fs=(await pickFiles('image/*',true)).slice(0,LIM.placePhotos-p.photos.length);for(const f of fs){try{p.photos.push((await addImage(f)).id);}catch(e){toast(e.message,4000);}}scheduleSave();renderPanel();renderPage();},'o s')))));
 return r;};
async function addDatePhotos(id){const it=S.fecha.items.find(x=>x.id===id);if(!it)return;it.photos=it.photos||[];const room=LIM.datePhotos-it.photos.length;if(room<=0)return toast('Máximo '+LIM.datePhotos+' fotos por fecha.');
 const fs=(await pickFiles('image/*',true)).slice(0,room);for(const f of fs){try{it.photos.push((await addImage(f)).id);}catch(e){toast(e.message,5000);if(/200 MB/.test(e.message))break;}}
 scheduleSave();renderPage();if(ui.tab==='fecha')renderPanel();}
TABV.fecha=()=>{const r=h('div',null,secHead('fecha'),h('p',{class:'note'},'Cuatro fechas: los dos cumpleaños, el primer mensaje y el día que se hicieron novios. Cada una admite hasta '+LIM.datePhotos+' fotos y un texto corto. Puedes cambiar los nombres.'));
 S.fecha.items.forEach(it=>{it.photos=it.photos||[];const t=fText('Texto corto',`fecha.items.${it.id}.text`,{area:1,rows:2});const ta=t.querySelector('textarea');if(ta)ta.maxLength=240;
  r.append(h('div',{class:'card'},fText('Nombre',`fecha.items.${it.id}.label`),Fl('Fecha',h('input',{type:'date',value:it.date||'',onChange:e=>{it.date=e.target.value;scheduleSave();renderPage();}})),
   h('div',{class:'f'},h('span',null,`Fotos (${it.photos.length}/${LIM.datePhotos})`),h('div',{class:'thumbs'},...it.photos.map(m=>h('div',null,h('img',{class:'mini',src:mediaSrc(m),alt:''}),h('div',null,btn('✕',()=>{it.photos=it.photos.filter(x=>x!==m);scheduleSave();gc();renderPanel();renderPage();},'d s'))))),btn('Agregar fotos',()=>addDatePhotos(it.id),'o s')),t));});return r;};
TABV.final=()=>h('div',null,secHead('final'),h('p',{class:'note'},'El collage se arma solo con las fotos de Historia, como postales. El video collage proyecta todos los videos de la sección Videos.'),
  Fl('Fecha en que estarán juntos (cuenta regresiva)',h('input',{type:'date',value:S.final.meetDate||'',onChange:e=>{S.final.meetDate=e.target.value;scheduleSave();renderPage();}})),
  fText('Texto de la cuenta','final.countLabel'),fText('Mensaje final','final.text',{area:1,rows:7}),fText('Firma','final.sign'));
function renderPanel(){if(!ui.edit)return;const tabs=$('.tabs');tabs.innerHTML='';TABS.forEach(([k,l])=>tabs.append(h('button',{class:'tab'+(ui.tab===k?' on':''),onClick:()=>setTab(k)},l)));
 const b=$('.pbody'),top=b.scrollTop;b.innerHTML='';b.append(TABV[ui.tab]());b.scrollTop=top;}
function setTab(t){ui.tab=t;ui.decoScope=null;ui.sel=null;if(t==='portada'&&ui.view==='reader')closeReader();else if(SECS.some(s=>s[0]===t)){if(ui.view!=='reader')openReader(true);if(t==='carta')go(ui.pages.findIndex(p=>p.k==='letter'));else goSec(t);}
 renderPanel();const on=$('.tab.on');if(on&&on.scrollIntoView)on.scrollIntoView({inline:'center',block:'nearest'});}
function setEdit(on){ui.edit=on;if(!on)ui.sel=null;$('.app').classList.toggle('editing',on);if(on)IDB.put('kv','owner',true);renderScene();if(ui.view==='reader')renderPage();renderPanel();}

/* ========== exportar / importar / publicar ========== */
const usedIds=()=>new Set(JSON.stringify(S).match(/md_\w+/g)||[]);
async function buildPayload(mode,{lock}={}){const media={};
 for(const id of usedIds()){const r=MEDIA.get(id);if(!r)continue;const o={kind:r.kind,type:r.type,name:r.name,size:r.size};if(r.url)o.url=r.url;else if(mode==='embed'&&r.blob)o.data=await blobToDataURL(r.blob);else continue;media[id]=o;}
 return{v:1,letterId:S.letterId,savedAt:S.savedAt,state:lock?{...S,lockEdit:true}:S,media};}
function buildHTML(payload){const c=document.documentElement.cloneNode(true);c.querySelector('#root').innerHTML='';const b=c.querySelector('body');b.removeAttribute('class');b.removeAttribute('style');
 c.querySelectorAll('[data-runtime]').forEach(n=>n.remove());c.querySelector('#letter-data').textContent=JSON.stringify(payload).replace(/</g,'\\u003c').replace(/\u2028|\u2029/g,'');
 return'<!DOCTYPE html>\n'+c.outerHTML;}
const slug=()=>(S.meta.title||'carta').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'carta';
async function exportHTML(){await flushSave();toast('Preparando el archivo…',120000);try{const html=buildHTML(await buildPayload('embed',{lock:true}));await download(`${slug()}.html`,html,'text/html');toast(`Archivo listo (${(html.length/1048576).toFixed(1)} MB). Súbelo a Netlify Drop o GitHub Pages para obtener tu enlace.`,7000);}catch(e){toast('No se pudo exportar: '+(e.message||e),6000);}}
async function exportJSON(){await flushSave();toast('Preparando respaldo…',120000);try{const p=await buildPayload('embed');await download(`${slug()}-respaldo.json`,JSON.stringify(p),'application/json');toast('Respaldo listo.');}catch(e){toast('No se pudo exportar: '+(e.message||e),6000);}}
async function importJSON(){const[f]=await pickFiles('.json,application/json');if(!f)return;try{const p=JSON.parse(await f.text());if(!p.state)throw new Error('Archivo no válido');toast('Importando…',120000);await adoptPayload(p);await gc();ui.sel=null;ui.place=null;ui.page=0;renderScene();if(ui.view==='reader')renderPage();renderPanel();toast('Respaldo importado.');}catch(e){toast('No se pudo importar: '+e.message,5000);}}
async function adoptPayload(p){for(const id of[...MEDIA.keys()])await IDB.del('media',id);MEDIA.clear();S=migrate(JSON.parse(JSON.stringify(p.state)));
 for(const id in(p.media||{})){const m=p.media[id];try{if(m.data)await registerMedia(dataURLToBlob(m.data),{kind:m.kind,name:m.name,id,url:m.url||null});
  else if(m.url){const rec={id,kind:m.kind,type:m.type,name:m.name,size:m.size||0,blob:null,url:m.url,src:m.url};MEDIA.set(id,rec);await IDB.put('media',id,{id,kind:m.kind,type:m.type,name:m.name,size:rec.size,blob:null,url:m.url});}}catch(e){console.warn(e);}}
 await flushSave();}
async function publishLink(){const c=window.claude;if(!c||!c.use){toast('Publicar en enlace solo funciona dentro de Claude. Aquí usa «Descargar HTML final».',6000);return;}
 const art=await c.use('artifact'),assets=await c.use('assets');if(!art||!assets){toast('Solo quien creó la página en Claude puede publicarla. Usa «Descargar HTML final».',6000);return;}
 await flushSave();const ids=usedIds();const recs=[...MEDIA.values()].filter(r=>ids.has(r.id)&&!r.url&&r.blob);const skipped=[];let n=0;
 for(const r of recs){toast(`Subiendo archivos ${++n} de ${recs.length}…`,120000);try{const up=await assets.upload(r.blob);r.url=up.url;const row=await IDB.get('media',r.id);if(row){row.url=r.url;await IDB.put('media',r.id,row);}}catch(e){skipped.push(r.name||r.id);}}
 toast('Publicando la carta…',120000);await flushSave();
 try{const html=buildHTML(await buildPayload('urls'));await art.publish(html);toast('Publicada. Abre el menú de la página → Compartir para copiar tu enlace.',9000);if(skipped.length)toast('No se subieron (superan 20 MB): '+skipped.join(', ')+'. Usa un enlace de YouTube.',9000);}
 catch(e){toast('No se pudo publicar: '+(e.message||e.code||e),7000);}}

/* ========== arranque ========== */
function mountApp(){const root=$('#root');root.innerHTML='';
 root.append(h('div',{class:'app'},h('div',{class:'stage'},h('div',{class:'scene'}),h('div',{class:'reader'})),
  h('aside',{class:'panel','aria-label':'Editor de la carta'},h('div',{class:'ph-head'},h('b',null,'Editor de la carta'),h('small',null,'Se guarda solo')),h('div',{class:'tabs'}),h('div',{class:'pbody'})),
  h('button',{class:'fab','aria-label':'Editar la carta',title:'Editar',onClick:()=>setEdit(!ui.edit)},'✎')));
 buildReader();$('.stage').addEventListener('pointerup',()=>{if(!Music.started)Music.start();},{once:true});window.addEventListener('keydown',gameKey);if(renderScene())playIntro();}
async function boot(){let payload=null;try{payload=JSON.parse($('#letter-data').textContent||'null');}catch(e){}
 await IDB.open('carta-'+((payload&&payload.letterId)||'main'));
 const local=await IDB.get('kv','state');const owner=!!(await IDB.get('kv','owner'));
 if(payload&&payload.state&&(!local||(payload.savedAt||0)>(local.savedAt||0)))await adoptPayload(payload);
 else if(local){S=migrate(local);for(const row of await IDB.all('media')){const rec={...row};rec.src=row.blob?(row.kind==='image'?await blobToDataURL(row.blob):URL.createObjectURL(row.blob)):row.url;MEDIA.set(row.id,rec);}}
 else{S=defaultState();await flushSave();}
 await gc();Music.init();mountApp();
 const fab=$('.fab');const showFab=!S.lockEdit||owner||/editar/i.test(location.hash);fab.hidden=!showFab;
 if(/editar/i.test(location.hash)&&showFab)setEdit(true);
 if(window.claude&&window.claude.use){window.claude.use('user').then(u=>{if(u&&u.canEdit&&u.canEdit()===false)fab.hidden=true;}).catch(()=>{});}
 setTimeout(()=>toast('Toca el sello para abrir la carta · ✎ para personalizarla',4500),900);
 window.addEventListener('beforeunload',()=>{if(saveT)flushSave();});}
boot().catch(e=>{console.error(e);const r=$('#root');if(r)r.textContent='No se pudo iniciar la carta: '+e.message;});
})();
</script>
